services:
  postgres:
    image: postgres:16
    container_name: stoneup-postgres
    environment:
      POSTGRES_DB: stoneup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - stoneup-postgres-data:/var/lib/postgresql/data

volumes:
  stoneup-postgres-data:
